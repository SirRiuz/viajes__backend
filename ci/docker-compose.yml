# Production stack: Granian behind nginx, sized for a small machine.
# Run it from the project root:
#   make prod-up
# It reads the same .env as the dev stack: Django from the mounted project
# folder (together with the generated migrations), Compose for the ${...}
# values here. The database is the one in .env (Neon, an SQLite file…), or
# the local `postgres` service with COMPOSE_PROFILES = "local-db".
# Containers are named *_prod_* so this stack and the dev one never clash;
# the Makefile stops one before starting the other (same ports).
#
# Several sites on one server: each project has its own APP_NAME (Compose
# project, containers, network and volume are named after it), its own
# NGINX_HOST_PORT and, behind Cloudflare, its own tunnel and token, which may
# belong to different Cloudflare accounts. Sites share nothing: separate
# networks, and each web container is capped at WEB_MEM_LIMIT.

name: ${APP_NAME:-viajes}

# DEBUG is forced off here, whatever .env says: no debug pages, GraphiQL,
# Swagger nor introspection in production (an environment variable wins over
# the .env file).
x-production: &production
  DEBUG: "False"

x-logging: &logging
  # Small disk: container logs rotate at 10 MB, 3 files per service
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Same service and volume as in docker-compose.yml, so both modes see the
  # same data. Not published on the host here.
  postgres:
    image: postgres:15
    profiles: ["local-db"]
    restart: unless-stopped
    container_name: "${APP_NAME:-viajes}_prod_postgres"
    environment:
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
    command: >
      -p ${DATABASE_PORT:-5432}
      -c max_connections=40
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=100
      -c wal_buffers=4MB
      -c idle_in_transaction_session_timeout=30000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -p ${DATABASE_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  migration:
    container_name: "${APP_NAME:-viajes}_prod_migration"
    build:
      context: ..
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # Migrations are not in git: they are generated here from the models
    # (same as `make prod-migrations`), then adopt_legacy_schema (one-time
    # move of a database from the old apps/* layout, no-op otherwise) and
    # migrate apply them.
    command: sh -c "python manage.py makemigrations --noinput && python manage.py adopt_legacy_schema && python manage.py migrate --noinput && python manage.py collectstatic --noinput -v 0"
    environment:
      <<: *production
      DATABASE_STATEMENT_TIMEOUT_MS: "0"
      CACHE_URL: ${CACHE_URL:-redis://valkey:6379/0}
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    logging: *logging

  web:
    container_name: "${APP_NAME:-viajes}_prod_django"
    restart: always
    build:
      context: ..
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # Image CMD: granian (Dockerfile sets the rest of its GRANIAN_* options)
    expose:
      - 8080
    # One site can't take the RAM of the others (Granian also recycles a
    # worker past 320 MiB)
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    environment:
      <<: *production
      CACHE_URL: ${CACHE_URL:-redis://valkey:6379/0}
      GRANIAN_WORKERS: ${GRANIAN_WORKERS:-2}
      GRANIAN_BLOCKING_THREADS: ${GRANIAN_BLOCKING_THREADS:-4}
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    logging: *logging

  valkey:
    image: valkey/valkey:9.0.6-alpine
    restart: unless-stopped
    container_name: "${APP_NAME:-viajes}_prod_valkey"
    # Only short-lived keys (rate limits, caches): no disk, 32 MB at most,
    # least recently used keys go first when full.
    command: valkey-server --save "" --appendonly no --loglevel warning --maxmemory 32mb --maxmemory-policy allkeys-lru
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  nginx:
    image: nginx:1.28.0-alpine
    container_name: "${APP_NAME:-viajes}_prod_nginx"
    restart: unless-stopped
    mem_limit: 64m
    # NGINX_BIND = 127.0.0.1 with the tunnel: nothing listens on the internet
    # (the tunnel reaches nginx inside the project's network). NGINX_HOST_PORT:
    # a different one per site when several run on the same server.
    ports:
      - ${NGINX_BIND:-0.0.0.0}:${NGINX_HOST_PORT:-${SERVER_PORT:-80}}:${SERVER_PORT:-80}
    environment:
      - SERVER_PORT=${SERVER_PORT:-80}
      - UPSTREAM_HOST=web
      - UPSTREAM_PORT=8080
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-staff/tools/}
      - ORIGIN_ONLY_CLOUDFLARE=${ORIGIN_ONLY_CLOUDFLARE:-1}
      - NGINX_ENVSUBST_FILTER=^(SERVER_PORT|UPSTREAM_HOST|UPSTREAM_PORT|INTERNAL_ADMIN_URL|ORIGIN_ONLY_CLOUDFLARE)$$
    volumes:
      - ../nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../static:/srv/static:ro
      - ../media:/srv/media:ro
    depends_on:
      - web
    logging: *logging

  # Cloudflare Tunnel, with COMPOSE_PROFILES including "tunnel" and
  # TUNNEL_TOKEN in .env: an outbound connection to Cloudflare carries the
  # traffic, so the server needs no open port and its IP is never answered on.
  # In the Cloudflare dashboard the tunnel's public hostname points to
  # http://nginx:<SERVER_PORT>.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    container_name: "${APP_NAME:-viajes}_prod_cloudflared"
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    mem_limit: 64m
    depends_on:
      - nginx
    logging: *logging

volumes:
  # Fixed name, shared with docker-compose.yml (they never run together)
  postgres_data:
    name: "${APP_NAME:-viajes}_postgres_data"
